name: scan
on:
  schedule:
    - cron: "5 */4 * * *"   # 5 minutes after every 4 hours (00:05, 04:05, 08:05, ...)
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          
      - run: pip install -r requirements.txt
      
      - name: run scanner
        run: |
          python breakout_scanner.py | tee output.txt
          
      - uses: actions/upload-artifact@v4.6.1
        with:
          name: scan-log
          path: output.txt
